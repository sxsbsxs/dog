name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and native build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test C checksum against Python zlib
        run: python tools/test_native_crc32.py
      - name: Check bundled yt-dlp plugin syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/videofetch-python-cache
        run: python -m py_compile app/src/main/assets/yt-dlp-plugins/videofetch/yt_dlp_plugins/extractor/niconico.py app/src/main/assets/yt-dlp-plugins/videofetch/yt_dlp_plugins/extractor/kuaishou.py app/src/main/assets/yt-dlp-plugins/videofetch/yt_dlp_plugins/extractor/douyin.py
      - name: Test Niconico V4/DMS extraction contract
        run: python tools/test_niconico_v4_extractor.py
      - name: Test shared URL normalization
        run: python tools/test_video_url_normalizer.py
      - name: Test Douyin share URL and SSR extraction contract
        run: python tools/test_social_extractors.py
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Verify Python and native runtime packages
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/*.apk; do
            python tools/check_native_runtime.py "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: videofetch-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: videofetch-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: videofetch-debug-x86
          path: app/build/outputs/apk/debug/app-x86-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: videofetch-debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
      - name: Smoke-test app startup on Android 14 emulator
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            PACKAGE="com.sxsbsxs.videofetch.debug"
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb logcat -c
            adb shell am start -W -n "$PACKAGE/com.sxsbsxs.videofetch.MainActivity"
            sleep 8
            if ! adb shell pidof "$PACKAGE" >/dev/null; then
              adb logcat -d -v threadtime | tail -n 500
              exit 1
            fi
            echo "video-dl remained alive after launch"
