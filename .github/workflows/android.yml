name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and native build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test C checksum against Python zlib
        run: python tools/test_native_crc32.py
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Verify Python and native runtime packages
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/*.apk; do
            python tools/check_native_runtime.py "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dog-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dog-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dog-debug-x86
          path: app/build/outputs/apk/debug/app-x86-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dog-debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
